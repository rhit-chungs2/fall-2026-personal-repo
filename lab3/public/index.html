<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Server</title>
</head>
<body>
    <!-- This is a comment( ctrl+ /) -->
    <h1> Serial Server!</h1>
    <p>This is the HTML client. There is also a MATLAB frontend</p>
    <div id="replyText"> the reply will go here</div>
    <hr>
    <button id="reset">RESET</button>
    <br><br>

    <button id="XAXIS1">X-AXIS 1</button>
    <button id="XAXIS2">X-AXIS 2</button>
    <button id="XAXIS3">X-AXIS 3</button>
    <button id="XAXIS4">X-AXIS 4</button>
    <button id="XAXIS5">X-AXIS 5</button>
    <br><br>

    <button id="ZEXTEND">Z-AXIS EXTEND</button>
    <button id="ZRETRACT">Z-AXIS RETRACT</button>
    <br><br>
    
    <button id="GRIPPEROPEN">GRIPPER OPEN</button>
    <button id="GRIPPERCLOSE">GRIPPER CLOSE</button>   
    <br><br>

    <input type="number" value="1" id="moveFrom">
    <input type="number" value="5" id="moveTo">
    <button id="move">MOVE</button>   
    <br><br>


    <script src="main.js"></script>
</body>
</html>
